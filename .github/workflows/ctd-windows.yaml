name: CTD OBS Windows
run-name: ${{ github.ref_name }} Windows build
# Pushes to ctd/** and ctd-v* tags run this through .github/workflows/ctd-build.yaml (CTD OBS), which also publishes
# GitHub Releases (docs/ctd/updates.md). workflow_dispatch builds it on its own (no channel: like a local build).
on:
  workflow_call:
    inputs:
      channel:
        description: 'Update channel compiled in: stable, test or empty (frontend/cmake/ctd-version.cmake)'
        type: string
        default: ''
      testNumber:
        description: 'Test build number N of ctd-v<X.Y.Z>-test.<N> (channel test only)'
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    name: Windows x64
    runs-on: windows-2025-vs2026
    env:
      CTD_OBS_CHANNEL: ${{ inputs.channel }}
      CTD_OBS_TEST_NUMBER: ${{ inputs.testNumber }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Package
        uses: ./.github/actions/package-obs
        with:
          target: x64
          config: RelWithDebInfo
          package: true

      # docs/ctd/ndi.md: the NDI module is in, the NDI library never is (CTD_NDI_BUNDLED is off)
      - name: Check NDI packaging
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem "${{ github.workspace }}/build_x64/ctd-obs-*-windows-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw 'No Windows package found' }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try { $entries = @($archive.Entries | ForEach-Object { $_.FullName }) } finally { $archive.Dispose() }
          if (-not ($entries | Where-Object { $_ -match '(^|[\\/])ctd-ndi\.dll$' })) { throw 'ctd-ndi.dll is not in the package' }
          $ndi = @($entries | Where-Object { $_ -match 'Processing\.NDI\.' })
          if ($ndi.Count -gt 0) { throw "NDI library in the package: $($ndi -join ', ')" }
          Write-Output "ctd-ndi.dll packaged; no NDI library in $($zip.Name)"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctd-obs-windows-x64-${{ github.sha }}
          path: ${{ github.workspace }}/build_x64/ctd-obs-*-windows-x64.zip

      # SIGNING HOOK: code signing is not set up yet. When a certificate is available, set the
      # CTD_SIGN_CMD environment variable on the Package step (from repository secrets, never
      # committed) to a command that signs "%1"; Package-Windows.ps1 then signs the installer and
      # its uninstaller. See the SIGNING HOOK in .github/scripts/Package-Windows.ps1.

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctd-obs-setup-windows-x64-${{ github.sha }}
          path: ${{ github.workspace }}/build_x64/CTD-OBS-Setup-*-x64.exe
          if-no-files-found: error
