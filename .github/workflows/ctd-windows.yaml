name: CTD OBS Windows
run-name: ${{ github.ref_name }} Windows build
on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - 'ctd/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    name: Windows x64
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Package
        uses: ./.github/actions/package-obs
        with:
          target: x64
          config: RelWithDebInfo
          package: true

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctd-obs-windows-x64-${{ github.sha }}
          path: ${{ github.workspace }}/build_x64/ctd-obs-*-windows-x64.zip
